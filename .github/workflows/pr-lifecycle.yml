name: PR Lifecycle

# Thin caller. The implementation lives in the administration repository so a fix
# reaches every repository at once.
#
# test-command must stay set. With it empty the guard generates no test step, so
# paginate.test.js and pricing.test.js are never executed by any run in this
# repository - the tests exist, look reassuring, and prove nothing. The review agent
# caught this on PR #24 after a caller update silently dropped it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

jobs:
  lifecycle:
    uses: lakshmanachari-panuganti/Repository-Administration-Governance/.github/workflows/pr-lifecycle.yml@main
    with:
      language: none
      test-command: 'node --test'
      enable-agents: true
    secrets: inherit
